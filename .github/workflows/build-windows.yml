name: Build Windows installer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21 + 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            25
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build MSI
        shell: cmd
        run: gradlew.bat :composeApp:packageMsi --stacktrace

      - name: Build EXE
        shell: cmd
        run: gradlew.bat :composeApp:packageExe --stacktrace

      - name: Show jpackage logs (on failure)
        if: failure()
        shell: bash
        run: |
          for f in composeApp/build/compose/logs/*/*.txt; do echo "===== $f"; cat "$f"; done || true

      - name: Upload jpackage logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jpackage-logs
          path: composeApp/build/compose/logs/

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: VitazoneSheetSync-windows
          path: |
            composeApp/build/compose/binaries/main/msi/*.msi
            composeApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release (only for tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            composeApp/build/compose/binaries/main/msi/*.msi
            composeApp/build/compose/binaries/main/exe/*.exe
