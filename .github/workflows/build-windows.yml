name: Build Windows installer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 + 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21 — для сборки/jpackage, 25 — для Gradle daemon (gradle-daemon-jvm.properties)
          java-version: |
            25
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build MSI + EXE
        shell: cmd
        run: gradlew.bat :composeApp:packageMsi :composeApp:packageExe --stacktrace

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: VitazoneSheetSync-windows
          path: |
            composeApp/build/compose/binaries/main/msi/*.msi
            composeApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release (only for tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            composeApp/build/compose/binaries/main/msi/*.msi
            composeApp/build/compose/binaries/main/exe/*.exe
